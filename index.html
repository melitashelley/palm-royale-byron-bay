<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Palm Royale — Byron Bay 2026</title>
<meta name="theme-color" content="#FCEEE1">
<meta name="description" content="The stylists' draw. Byron Bay Girls Weekend 2026.">

<!-- The web app this frames. Spreadsheet -> Palm Royale -> Show web app link. -->
<script>
  const APP_URL = "https://script.google.com/macros/s/AKfycbyzhdot8C9RJmrwFLoheKMzvRaq117CIFq9wP9DnnjN_87PY_9jOUqhmSIEzobaNfCk/exec";
</script>

<style>
  /* The frame is exactly the size of the screen and does its own scrolling.
     This page never scrolls, so it can't end up stranded halfway down. */
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #FCEEE1; overscroll-behavior: none;
  }
  #frame {
    display: block; border: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
  }
</style>

<div id="mount"></div>

<script>
(function () {
  const frame = document.createElement('iframe');
  frame.id = 'frame';
  frame.src = APP_URL;
  frame.title = 'The Palm Royale styling draw';
  frame.allow = 'clipboard-write; web-share';
  document.getElementById('mount').appendChild(frame);
})();
</script>
</html>
